<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homenagem ao Professor Caio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: rgba(0, 0, 0, 0.3);
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
        }

        h1 {
            font-size: 3em;
        }

        p {
            font-size: 1.4em;
        }

        .emoji {
            font-size: 3em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🏆📚</div>
        <h1>Caio é o Melhor Professor!</h1>
        <p>
            Obrigado por compartilhar conhecimento, inspirar os alunos e
            tornar o aprendizado mais interessante todos os dias.
        </p>
        <h2>Parabéns, Professor Caio! 🎉</h2>
    </div>
</body>
</html>
